<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1120" width="920" height="1120" style="background:#f8fafc; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop shadow for stars -->
    <filter id="starShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <!-- Shadow for cards -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <!-- Gold gradient for stars -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- PACIFIC OCEAN (Schematic coastal curve) -->
  <path d="M 0 0 L 160 0 C 160 180, 150 260, 140 380 C 130 500, 100 580, 95 680 C 90 760, 110 840, 120 900 C 130 960, 120 1040, 110 1120 L 0 1120 Z" 
        fill="#E0F2FE" stroke="#BAE6FD" stroke-width="2"/>
  
  <text x="50" y="560" fill="#0284C7" font-size="14" font-weight="700" letter-spacing="4" transform="rotate(-90 50 560)" opacity="0.6">PACIFIC OCEAN</text>

  <!-- TITLE BLOCK -->
  <g transform="translate(40, 45)">
    <rect x="0" y="0" width="380" height="74" rx="12" fill="#ffffff" filter="url(#cardShadow)" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="18" y="30" font-size="18" font-weight="800" fill="#0f172a" letter-spacing="-0.3">Italian School of San Diego</text>
    <text x="18" y="52" font-size="13" font-weight="600" fill="#64748b">Countywide Instructors &amp; Classrooms</text>
  </g>

  <!-- FREEWAY NETWORK (Clean schematic paths) -->
  <g stroke="#94A3B8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- SR-78 -->
    <path d="M 180 180 L 580 180" stroke-width="4"/>
    
    <!-- SR-56 -->
    <path d="M 175 450 L 580 450" stroke-width="3.5"/>
    
    <!-- SR-52 -->
    <path d="M 180 620 L 730 620" stroke-width="3.5"/>
    
    <!-- I-8 -->
    <path d="M 160 760 L 780 760" stroke-width="4"/>
    
    <!-- I-5 (Coastal Corridor) -->
    <path d="M 190 120 L 185 200 L 180 340 L 175 450 L 185 550 L 195 650 L 210 760 L 215 880 L 225 1060" stroke-width="5" stroke="#64748B"/>
    
    <!-- I-805 (Bypass) -->
    <path d="M 175 480 C 240 520, 270 560, 290 620 L 310 760 C 310 820, 290 920, 235 1040" stroke-width="3.5" stroke="#64748B" stroke-dasharray="6,4"/>
    
    <!-- I-15 (Inland Corridor) -->
    <path d="M 580 120 L 580 180 L 580 320 L 580 450 L 580 620 L 580 760 L 580 840 C 580 920, 480 1000, 240 1055" stroke-width="4.5" stroke="#64748B"/>

    <!-- SR-125 / East Connector -->
    <path d="M 730 620 L 730 760 C 730 840, 710 900, 680 960" stroke-width="3" stroke="#94A3B8"/>
  </g>

  <!-- FREEWAY ROUTE BADGES -->
  <g font-size="10" font-weight="800" text-anchor="middle" fill="#ffffff">
    <!-- I-5 Badges -->
    <rect x="175" y="145" width="26" height="18" rx="4" fill="#1E3A8A"/>
    <text x="188" y="158">I-5</text>
    
